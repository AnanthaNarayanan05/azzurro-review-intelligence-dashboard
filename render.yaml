# Render Blueprint for the API (FastAPI). The web app is deployed separately on Vercel and the database is a
# Neon PostgreSQL project; see docs/GO_LIVE.md for the click-by-click steps.
#
# Free plan notes (Render docs, checked 2026-11-24): the service sleeps after 15 minutes without traffic and takes
# about a minute to wake; the disk is wiped on every restart (fine: uploads exist only between preview and import);
# there is no pre-deploy command on the free plan, so the migrations run at the start of the start command.
services:
  - type: web
    name: azzurro-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # The tested Python version. Render's own default is newer and has not been tried with these dependencies.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      # Public demo limits: small uploads only, and only a single running instance (uploads sit on its local disk).
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: MAX_IMPORT_ROWS
        value: "5000"
      - key: UPLOAD_DIR
        value: /tmp/azzurro-uploads
      # Secrets and per-deployment values: Render asks for them in its dashboard; they are never stored in this file.
      # Use Neon's DIRECT connection string (pooling switched off), because it also runs the migrations.
      - key: DATABASE_URL
        sync: false
      # The exact web address, e.g. https://azzurro-demo.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
